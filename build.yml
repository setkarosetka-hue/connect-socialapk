
name: Connect Windows 7 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --package-lock=false

      - name: Create Connect icon
        run: |
          python -m pip install Pillow
          python -c "from PIL import Image; Image.open('connect-icon-512.png').convert('RGBA').save('connect-icon.ico',format='ICO',sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build installer
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Connect-Windows-7
          path: dist/*.exe
          if-no-files-found: error
